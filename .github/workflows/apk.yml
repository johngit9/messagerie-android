name: Compiler l'APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accepter les licences Android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -E '^ *(platforms;android-3[6-9]|build-tools;3[6-9])' | sort -u || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Préparer la clé de signature
        env:
          CLE: ${{ secrets.CLE_SIGNATURE_BASE64 }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > "$RUNNER_TEMP/cle.jks"
            echo "CLE_SIGNATURE_FICHIER=$RUNNER_TEMP/cle.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe du dépôt"
          else
            echo "::warning::Signature : clé de débogage (secrets CLE_SIGNATURE_* absents)"
          fi

      - name: Compiler
        env:
          CLE_SIGNATURE_MDP: ${{ secrets.CLE_SIGNATURE_MDP }}
          CLE_SIGNATURE_ALIAS: ${{ secrets.CLE_SIGNATURE_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "Messagerie-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Messagerie-apk
          path: Messagerie-v1.${{ github.run_number }}.apk

      - name: Rédiger les nouveautés
        if: github.ref == 'refs/heads/main'
        run: |
          # Messages des commits depuis la Release précédente : titre et lignes « - … » (sans les signatures)
          PREC=$(git tag --list 'v1.*' --sort=-v:refname | head -1)
          PLAGE=${PREC:+$PREC..}HEAD
          {
            echo "## Nouveautés"
            git log $PLAGE --no-merges --format='%s%n%b%x1e' | python3 -c '
          import sys
          vus = set()
          for bloc in sys.stdin.read().split("\x1e"):
              lignes = [l.rstrip() for l in bloc.strip().splitlines() if l.strip()]
              if not lignes: continue
              for i, l in enumerate(lignes):
                  if l.startswith(("Co-Authored-By", "Claude-Session")): continue
                  if i == 0: t = "- " + l
                  elif l.lstrip().startswith("- "): t = "  " + l.strip()
                  elif l.startswith("  ") and not l.lstrip().startswith("- "): t = "    " + l.strip()
                  else: continue
                  if t not in vus: vus.add(t); print(t)
          '
            echo
            echo "---"
            echo "APK de la Messagerie unifiée pour Android : touchez **Messagerie-v1.${{ github.run_number }}.apk** ci-dessous pour le télécharger, puis installez-le."
            echo "Au premier lancement, renseignez vos serveurs dans **Réglages** (aucune adresse ni jeton n'est inclus dans l'appli)."
          } > notes.md
          cat notes.md

      - name: Publier dans les Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Messagerie v1.${{ github.run_number }}
          body_path: notes.md
          files: Messagerie-v1.${{ github.run_number }}.apk
          make_latest: true
