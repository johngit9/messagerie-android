name: Compiler l'APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accepter les licences Android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -E '^ *(platforms;android-3[6-9]|build-tools;3[6-9])' | sort -u || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Préparer la clé de signature
        env:
          CLE: ${{ secrets.CLE_SIGNATURE_BASE64 }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > "$RUNNER_TEMP/cle.jks"
            echo "CLE_SIGNATURE_FICHIER=$RUNNER_TEMP/cle.jks" >> "$GITHUB_ENV"
            echo "Signature : clé fixe du dépôt"
          else
            echo "::warning::Signature : clé de débogage (secrets CLE_SIGNATURE_* absents)"
          fi

      - name: Compiler
        env:
          CLE_SIGNATURE_MDP: ${{ secrets.CLE_SIGNATURE_MDP }}
          CLE_SIGNATURE_ALIAS: ${{ secrets.CLE_SIGNATURE_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "Messagerie-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Messagerie-apk
          path: Messagerie-v1.${{ github.run_number }}.apk

      - name: Publier dans les Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Messagerie v1.${{ github.run_number }}
          body: |
            APK de la Messagerie unifiée pour Android.
            Sur le téléphone : touchez **Messagerie-v1.${{ github.run_number }}.apk** ci-dessous pour le télécharger, puis installez-le.
            Au premier lancement, renseignez vos serveurs dans **Réglages** (aucune adresse ni jeton n'est inclus dans l'appli).
          files: Messagerie-v1.${{ github.run_number }}.apk
          make_latest: true
